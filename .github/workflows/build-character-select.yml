name: Publish 3D PLAY 1.2 Character Select

on:
  push:
    branches:
      - test/3d-play12-character-select

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build PS1 image
        id: ps1build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          make build > character-build.log 2>&1
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Prepare published result
        shell: bash
        run: |
          mkdir -p published/character-select
          if [ "${{ steps.ps1build.outputs.rc }}" = "0" ]; then
            cp build/primapi.bin published/character-select/PRISMA_3D_PLAY12_CHARACTER_SELECT.bin
            cp build/primapi.cue published/character-select/PRISMA_3D_PLAY12_CHARACTER_SELECT.cue
            echo SUCCESS > published/character-select/STATUS.txt
          else
            echo FAILURE > published/character-select/STATUS.txt
          fi
          tail -200 character-build.log > published/character-select/build-tail.txt || true
      - name: Commit result to test branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f published/character-select
          git commit -m "Publish character-select test build [skip ci]" || exit 0
          git push
