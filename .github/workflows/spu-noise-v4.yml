name: Build SPU_NOISE_V4

on:
  push:
    branches: [spu-noise-v4]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build SPU_NOISE_V4 BIN/CUE
        run: make -f spu-noise-v4/Makefile build

      - name: Upload SPU_NOISE_V4
        uses: actions/upload-artifact@v4
        with:
          name: SPU_NOISE_V4
          path: |
            spu-noise-v4/build/spu-noise-v4.bin
            spu-noise-v4/build/spu-noise-v4.cue
