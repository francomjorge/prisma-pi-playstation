name: Build PRISMA-PI PS1

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PS1 BIN/CUE
        run: make build

      - name: Upload disc image
        uses: actions/upload-artifact@v4
        with:
          name: primapi-ps1
          path: |
            build/primapi.bin
            build/primapi.cue
