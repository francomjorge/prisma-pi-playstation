name: Build WOOF_ONLY_V2

on:
  push:
    branches: [audio-autoplay-test]
    paths:
      - 'woof-only-v2/**'
      - 'audio-autoplay-test/assets/woof.psau.b64.*'
      - '.github/workflows/woof-only-v2.yml'
  workflow_dispatch:

concurrency:
  group: woof-only-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build WOOF_ONLY_V2 BIN/CUE
        run: make -f woof-only-v2/Makefile build

      - name: Upload WOOF_ONLY_V2
        uses: actions/upload-artifact@v4
        with:
          name: WOOF_ONLY_V2
          path: |
            woof-only-v2/build/WOOF_ONLY_V2.bin
            woof-only-v2/build/WOOF_ONLY_V2.cue
