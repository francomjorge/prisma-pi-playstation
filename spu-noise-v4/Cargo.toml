[package]
name = "spu-noise-v4"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[workspace]

[[bin]]
name = "spu-noise-v4"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true

[dependencies]
psx-gpu = { path = "../../crates/psx-gpu" }
psx-rt  = { path = "../../crates/psx-rt" }
psx-spu = { path = "../../crates/psx-spu" }
